name: aqua_sort
description: "Aqua Sort by WebSpider Studios — Multiplayer water-sorting puzzle game."
publish_to: 'none'

version: 1.2.1+9

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.3.3
  flutter_animate: ^4.5.0
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  pin_code_fields: ^8.0.1
  country_code_picker: ^3.4.1
  audioplayers: ^6.6.0
  intl: ^0.20.2
  supabase_flutter: ^2.12.2
  firebase_core: ^3.12.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.1.1
  app_links: ^7.0.0
  games_services: ^5.0.0
  google_mobile_ads: ^5.3.0
  in_app_purchase: ^3.2.3
  url_launcher: ^6.3.1
  in_app_update: ^4.2.2
  onesignal_flutter: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/app_icon.png"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/audio/
    - assets/webspider_coins/
