name: aqua_sort
description: "Aqua Sort by WebSpider Studios — Multiplayer water-sorting puzzle game."
publish_to: 'none'

version: 1.1.0+5

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.3.3
  flutter_animate: ^4.5.0
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  pin_code_fields: ^8.0.1
  country_code_picker: ^3.4.1
  audioplayers: ^6.6.0
  intl: ^0.20.2
  supabase_flutter: ^2.12.2
  app_links: ^7.0.0
  games_services: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/app_icon.png"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/audio/
    - assets/webspider_coins/
